name: Publish ChatGPT Daily Brief

on:
  push:
    branches:
      - chatgpt-delivery
    paths:
      - "incoming/current/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stacorp-chatgpt-daily-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Ho_Chi_Minh
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
      TEAMS_TARGET_TYPE: channel
      TEAMS_TEAM_ID: 85f93dd1-97df-43b4-88c2-a156e57b5223
      TEAMS_CHANNEL_ID: 19:ae875099856a42569438d9c056e1294f@thread.tacv2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify approved production layout
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = "STACORP_EDITORIAL_3PAGE_FINAL_V3_REGIONAL_8NEWS"
          config = json.loads(Path("config/approved_layout.json").read_text(encoding="utf-8"))
          if config.get("version") != expected or not config.get("locked"):
              raise SystemExit("Approved production layout lock is invalid.")
          if config.get("canvas") != {"width": 1080, "height": 1620, "pages": 3}:
              raise SystemExit("Approved production canvas/page count changed.")
          teams = config.get("teams_transport", {})
          master = config.get("render", {}).get("teams_master", {})
          if teams.get("format") != "JPEG":
              raise SystemExit("Teams transport must use locked JPEG mode.")
          if teams.get("max_page_bytes") != 850000 or teams.get("max_binary_total") != 2550000:
              raise SystemExit("Teams payload budget changed.")
          if master.get("width") != 1200 or master.get("height") != 1800:
              raise SystemExit("Teams high-density master dimensions changed.")

          source_quality = config.get("source_visual_quality", {})
          expected_quality = {
              "min_long_edge": 1400,
              "min_short_edge": 900,
              "min_source_bytes": 250000,
              "min_sharpness": 18.0,
              "reject_webp": True,
              "reject_preview_thumbnail": True,
              "fail_closed": True,
          }
          for key, value in expected_quality.items():
              if source_quality.get(key) != value:
                  raise SystemExit(
                      f"Source visual quality lock changed for {key}: "
                      f"{source_quality.get(key)!r} != {value!r}"
                  )
          if source_quality.get("story_count") != 8:
              raise SystemExit("Source visual story_count must be 8.")

          editorial = config.get("editorial_scope", {})
          if editorial.get("item_count") != 8:
              raise SystemExit("Editorial item_count must be 8.")
          if editorial.get("minimum_north_items") != 3 or editorial.get("minimum_central_items") != 3:
              raise SystemExit("North/Central regional minimums changed.")
          if editorial.get("maximum_national_items") != 2:
              raise SystemExit("National item cap changed.")

          summary = config.get("summary_schema", {})
          if summary.get("department_digest_count") != 4:
              raise SystemExit("department_digest_count changed.")
          if summary.get("watchpoints_count") != 3:
              raise SystemExit("watchpoints_count changed.")

          print(f"APPROVED_LAYOUT_VERSION={expected}")
          print("LAYOUT_LOCK_LEVEL=FINAL")
          print("TEAMS_TRANSPORT=JPEG_1200X1800_444")
          print("SOURCE_VISUAL_POLICY=ORIGINAL_ONLY_FAIL_CLOSED")
          PY

      - name: Validate original source visuals
        run: python -m src.validate_source_visuals

      - name: Publish ChatGPT package to Teams
        run: python -m src.publish_incoming

      - name: Preserve published IDs only
        if: ${{ hashFiles('incoming/current/.no_state_update') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          cp incoming/current/brief.json /tmp/stacorp-published-brief.json
          git fetch origin main
          git checkout main
          python -m src.merge_state /tmp/stacorp-published-brief.json

          if git diff --quiet -- state/published_hashes.json; then
            echo "No deduplication state change."
            exit 0
          fi

          git config user.name "stacorp-daily-brief-bot"
          git config user.email "stacorp-daily-brief-bot@users.noreply.github.com"
          git add state/published_hashes.json
          git commit -m "chore: remember published ChatGPT brief"
          git push origin main
