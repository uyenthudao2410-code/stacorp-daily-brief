name: STACORP Daily Brief

on:
  schedule:
    # 01:30 UTC = 08:30 Asia/Ho_Chi_Minh
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Use deterministic sample content instead of live news"
        type: boolean
        required: false
        default: true
      visuals:
        description: "Generate editorial story visuals with OpenAI Image API"
        type: boolean
        required: false
        default: false
      publish:
        description: "Post the generated pages to Teams"
        type: boolean
        required: false
        default: false
      preview_artifact:
        description: "Upload a 1-day preview artifact for manual review"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  brief:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Ho_Chi_Minh
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2.5-flare' }}
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
      TEAMS_TARGET_TYPE: ${{ vars.TEAMS_TARGET_TYPE || 'chat' }}
      TEAMS_CHAT_ID: ${{ secrets.TEAMS_CHAT_ID }}
      TEAMS_TEAM_ID: ${{ secrets.TEAMS_TEAM_ID }}
      TEAMS_CHANNEL_ID: ${{ secrets.TEAMS_CHANNEL_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build brief
        shell: bash
        run: |
          set -euo pipefail
          ARGS=""

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.demo }}" == "true" ]]; then
            ARGS="$ARGS --demo"
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            ARGS="$ARGS --visuals --publish"
          else
            if [[ "${{ inputs.visuals }}" == "true" ]]; then
              ARGS="$ARGS --visuals"
            fi
            if [[ "${{ inputs.publish }}" == "true" ]]; then
              ARGS="$ARGS --publish"
            fi
          fi

          python -m src.main $ARGS

      - name: Upload temporary preview
        if: github.event_name == 'workflow_dispatch' && inputs.preview_artifact && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: stacorp-daily-brief-preview
          path: |
            /tmp/stacorp-daily-brief/STACORP_DAILY_BRIEF_PAGE_1.png
            /tmp/stacorp-daily-brief/STACORP_DAILY_BRIEF_PAGE_2.png
          retention-days: 1
          if-no-files-found: error

      - name: Persist only deduplication state after successful publish
        if: (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- state/published_hashes.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "stacorp-daily-brief-bot"
          git config user.email "stacorp-daily-brief-bot@users.noreply.github.com"
          git add state/published_hashes.json
          git commit -m "chore: update published-news dedupe state"
          git push
